    # Marketing Pilot (marketing-pilot/, systemd app-marketing-pilot, Port 8105).
    # Auth prüft der Dienst selbst (Dashboard-JWT aus Cookie empire_session oder Bearer).
    location = /mp { return 301 /mp/; }
    location /mp/ {
        proxy_pass         http://127.0.0.1:8105;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /api/mp/ {
        proxy_pass         http://127.0.0.1:8105;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        client_max_body_size 50M;
    }
